<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AE 网络</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--fg:#1d2330;--muted:#6b7280;--line:#e1e4ea;--soft:#f0f2f5;
  --accent:#2f6fde;--ok:#1f8a5b;--warn:#b7791f;--err:#c2412d;--bar:#2f6fde;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14171c;--card:#1d2128;--fg:#e6e8eb;--muted:#9aa1ad;--line:#30353f;--soft:#252a33;
  --accent:#6b9cf0;--ok:#4cc38a;--warn:#e0a84a;--err:#ef7d68;--bar:#6b9cf0;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:1480px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:17px;margin:0;margin-right:auto}
h2{font-size:15px;margin:0 0 12px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
h2 small{font-weight:400;color:var(--muted);font-size:13px}
main{max-width:1480px;margin:0 auto;padding:16px;display:grid;gap:16px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.err{color:var(--err)}
button,select,input{font:inherit;color:inherit}
button{background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:5px 12px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--soft);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px}
.meter{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:4px 0 14px}
.meter i{display:block;height:100%;background:var(--bar)}
.cpus{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cpu{border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.cpu.busy{border-color:var(--accent)}
.cpu .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.cpu .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpu .meta{color:var(--muted);font-size:12px}
.cpu .out{margin-top:6px;overflow-wrap:anywhere}
details{margin-top:6px;font-size:13px}
summary{cursor:pointer;color:var(--muted)}
details ul{margin:4px 0 0;padding-left:18px;max-height:220px;overflow:auto}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tools input{flex:1 1 220px;min-width:0;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:transparent}
.tools select{padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:6px}
.card{display:flex;gap:8px;padding:6px;border:1px solid var(--line);border-radius:8px;min-width:0;background:var(--card)}
.card .pic{flex:0 0 34%;max-width:80px;aspect-ratio:1;display:grid;place-items:center;
  background:var(--soft);border-radius:6px;align-self:center}
.card .pic .ic{width:80%;height:80%}
.card .body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.card .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:13px;line-height:1.35;overflow-wrap:anywhere}
.card .cnt{font-size:13px}
.card .foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 4px}
.card .foot .tag{white-space:nowrap;font-size:10px;padding:0 4px}
.card .cnt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.card .tag{margin-left:0}
.grid.compact{grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:4px}
.slot{position:relative;aspect-ratio:1;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:4px;background:var(--soft);min-width:0}
.slot .ic{width:68%;height:68%}
.slot .cnt{position:absolute;right:3px;bottom:1px;font-size:11px;font-weight:700;line-height:1.2;
  font-variant-numeric:tabular-nums;text-shadow:0 0 2px var(--card),0 0 2px var(--card)}
.slot .mark{position:absolute;left:3px;top:3px;width:7px;height:7px;border-radius:50%}
.slot .mark.can{background:var(--accent)}
.slot .mark.fluid{background:var(--muted)}
.craftable{cursor:pointer}
.card.craftable:hover,.slot.craftable:hover{border-color:var(--accent)}
@media (max-width:480px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
  .card{gap:8px;padding:6px}
  .card .nm{font-size:13px}
}
.label{overflow-wrap:anywhere}
.reg{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.tag{font-size:11px;padding:0 6px;border-radius:4px;background:var(--soft);color:var(--muted);margin-left:6px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--muted)}
.empty{color:var(--muted);padding:12px 0}
.ic{width:32px;height:32px;flex:none;image-rendering:pixelated;vertical-align:middle}
.ic.s{width:20px;height:20px}
.ic.none{display:inline-block;border-radius:4px;background:var(--soft)}
.ilist li{display:flex;gap:6px;align-items:center;list-style:none}
details ul.ilist{padding-left:4px}
.inline{display:inline-flex;gap:6px;align-items:center;vertical-align:middle;max-width:100%}
dialog .head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
dialog .head .reg{margin:0}
.tag.can{color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--err)}
button.small{padding:1px 8px;font-size:12px}
.cpu .actions{margin-top:8px;text-align:right}
.orders{display:grid;gap:0}
.order{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line)}
.order:first-child{border-top:0}
.order .what{overflow-wrap:anywhere}
.order .meta{color:var(--muted);font-size:12px;grid-column:1}
.order .right{grid-row:1 / span 2;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);
  padding:20px;width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 4px;font-size:16px}
dialog .reg{margin-bottom:12px}
dialog label{display:block;margin:12px 0 4px;color:var(--muted);font-size:13px}
dialog input,dialog select{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card)}
.steps{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.steps button{flex:1;padding:4px 0;font-size:13px}
.note{color:var(--muted);font-size:12px;margin:12px 0 0}
.err-text{color:var(--err);font-size:13px;margin:10px 0 0}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
</style>
</head>
<body>
<header><div class="bar">
  <h1>AE 网络</h1>
  <span id="statusPill" class="pill">等待数据</span>
  <span id="itemsPill" class="pill">库存：无</span>
  <form method="post" action="logout"><button>退出</button></form>
</div></header>
<main>
  <section>
    <h2>能量</h2>
    <div id="power" class="empty">还没有收到 OC 的上报</div>
  </section>
  <section>
    <h2>合成 CPU <small id="cpuSummary"></small></h2>
    <div id="cpus" class="cpus"></div>
  </section>
  <section>
    <h2>订单 <small>点库存里标着"可合成"的物品下单</small></h2>
    <div id="orders" class="orders"><div class="empty">还没有订单</div></div>
  </section>
  <section>
    <h2>库存 <small id="itemsMeta"></small></h2>
    <div class="tools">
      <input id="q" type="search" placeholder="搜索中文名、英文名或注册名（空格分隔多个关键词）">
      <select id="kind">
        <option value="all">全部</option><option value="i">物品</option>
        <option value="f">流体</option><option value="c">可合成</option>
      </select>
      <select id="sort">
        <option value="size:desc">数量 多→少</option><option value="size:asc">数量 少→多</option>
        <option value="name:asc">名称 A→Z</option>
      </select>
      <button id="viewToggle" type="button"></button>
    </div>
    <div id="rows" class="grid"></div>
    <div id="itemsEmpty" class="empty" hidden>没有匹配的条目</div>
    <div class="pager">
      <span id="pageInfo"></span>
      <button id="prev">上一页</button><button id="next">下一页</button>
    </div>
  </section>
</main>
<dialog id="orderDialog">
  <form id="orderForm" method="dialog">
    <div class="head">
      <span id="odIcon"></span>
      <div><h3 id="odName"></h3><span class="reg" id="odReg"></span></div>
    </div>
    <div class="meta">当前库存：<span id="odStock"></span></div>
    <label for="odAmount">数量</label>
    <input id="odAmount" type="number" min="1" step="1" value="1" required>
    <div class="steps">
      <button type="button" data-step="-1000">-1000</button><button type="button" data-step="-100">-100</button>
      <button type="button" data-step="-10">-10</button><button type="button" data-step="-1">-1</button>
      <button type="button" data-step="1">+1</button><button type="button" data-step="10">+10</button>
      <button type="button" data-step="100">+100</button><button type="button" data-step="1000">+1000</button>
    </div>
    <label for="odCpu">合成 CPU</label>
    <select id="odCpu"></select>
    <p class="note" id="odCpuHint" hidden>只能指定有名字的 CPU：在铁砧里给一个合成存储器或合成单元改名，再放进 CPU 结构里。</p>
    <p class="err-text" id="odError" hidden></p>
    <div class="dialog-actions">
      <button type="button" id="odCancel">取消</button>
      <button type="submit" class="primary" id="odSubmit">开始合成</button>
    </div>
  </form>
</dialog>
<script>
// Page size is a whole number of grid rows (about the view's target count), so
// every page but the last ends on a full row; it follows the column count.
const PAGE_TARGET = {cards: 240, compact: 480};
const PAGE_MAX = 500; // backend limit
let pageSize = PAGE_TARGET.cards;
const $ = id => document.getElementById(id);
const full = new Intl.NumberFormat("en-US");

// Port of AE2's ReadableNumberConverter (toWideReadableForm, the terminal's
// small-font width of 4): base 1000, suffixes kMGTPE, one truncated decimal
// (kept even when it is 0, e.g. "1.0M"), dropped when it does not fit.
function aeNum(n, width = 4) {
  n = Math.max(0, Math.floor(Number(n) || 0));
  const s = String(n);
  if (s.length <= width) return s;
  let base = n, last = n, exp = -1, len = s.length, post = "";
  while (len > width) {
    last = base;
    base = Math.floor(base / 1000);
    exp++;
    len = String(base).length + 1;
    post = "kMGTPE"[exp];
  }
  const tenths = Math.floor(last / 100);
  const withDecimal = `${Math.floor(tenths / 10)}.${tenths % 10}${post}`;
  return withDecimal.length <= width ? withDecimal : base + post;
}
let offset = 0, total = 0, lastItemsUpdate = null, itemsTimer = null;
let lastState = null, currentRows = [], orderItem = null;

const esc = s => String(s ?? "").replace(/§./g, "").replace(/[&<>"]/g,
  c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const num = n => aeNum(n);
const exact = n => full.format(Math.floor(Number(n) || 0));
const bytes = n => {
  const units = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return `${Math.round(n * 10) / 10} ${units[i]}`;
};
const ago = s => s < 60 ? `${Math.round(s)} 秒前` : s < 3600 ? `${Math.round(s / 60)} 分钟前`
  : `${Math.round(s / 3600)} 小时前`;

async function api(path) {
  const res = await fetch(path, {cache: "no-store"});
  if (res.status === 401) { location.href = "login"; throw new Error("login"); }
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

async function postJson(path, body) {
  const res = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)});
  if (res.status === 401) { location.href = "login"; throw new Error("请重新登录"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = data.detail;
    throw new Error(typeof d === "string" ? d : Array.isArray(d) ? d.map(x => x.msg).join("；") : `HTTP ${res.status}`);
  }
  return data;
}

function pill(el, text, cls) { el.textContent = text; el.className = "pill " + cls; }

function renderPower(p) {
  if (!p) return;
  const pct = p.max > 0 ? Math.min(100, p.stored / p.max * 100) : 0;
  $("power").className = "";
  $("power").innerHTML = `
    <div class="meta" title="${exact(p.stored)} / ${exact(p.max)} AE">储能 ${num(p.stored)} / ${num(p.max)} AE（${pct.toFixed(1)}%）</div>
    <div class="meter"><i style="width:${pct}%"></i></div>
    <div class="stats">
      <div class="stat"><b title="${exact(p.avgUse)}">${num(p.avgUse)}</b><span>平均消耗 AE/t</span></div>
      <div class="stat"><b title="${exact(p.avgInject)}">${num(p.avgInject)}</b><span>平均输入 AE/t</span></div>
      <div class="stat"><b title="${exact(p.idle)}">${num(p.idle)}</b><span>待机消耗 AE/t</span></div>
    </div>`;
}

const icon = (ic, cls = "") => ic
  ? `<img class="ic ${cls}" src="icons/${ic}.png" loading="lazy" alt="">`
  : `<span class="ic ${cls} none"></span>`;
const itemText = it => `<span class="inline">${icon(it.ic, "s")}<span title="${esc(it.l)}">${esc(it.z || it.l)}</span></span>`
  + ` × <span title="${exact(it.s)}">${num(it.s)}</span>`;
const itemList = (title, list, more) => list && list.length ? `<details><summary>${title}（${list.length}${more ? "+" : ""}）</summary>
  <ul class="ilist">${list.map(it => `<li>${itemText(it)}</li>`).join("")}</ul></details>` : "";

function renderCpus(cpus) {
  cpus = cpus || [];
  const busy = cpus.filter(c => c.busy).length;
  $("cpuSummary").textContent = cpus.length ? `忙碌 ${busy} / 共 ${cpus.length}` : "";
  const open = new Set([...document.querySelectorAll("#cpus details[open]")].map(d => d.dataset.key));
  const sorted = [...cpus].sort((a, b) => (b.busy - a.busy) || a.name.localeCompare(b.name));
  $("cpus").innerHTML = sorted.length ? sorted.map(c => `
    <div class="cpu ${c.busy ? "busy" : ""}">
      <div class="top"><span class="name" title="${esc(c.name)}">${esc(c.name)}</span>
        <span class="pill ${c.busy ? "ok" : ""}">${c.busy ? "合成中" : "空闲"}</span></div>
      <div class="meta">${bytes(c.storage)} · 协处理器 ${c.coprocessors}</div>
      ${c.busy ? `<div class="out">目标：${c.final ? itemText(c.final)
        : /No crafting monitor/.test(c.finalError || "") ? '<span class="meta">未知（CPU 里没有合成监控器）</span>'
        : '<span class="meta">未知</span>'}</div>` : ""}
      ${itemList("正在合成", c.active, c.truncated)}${itemList("等待中", c.pending, c.truncated)}
      ${c.busy && c.index ? `<div class="actions"><button class="small danger" data-cancel-cpu="${c.index}"
        data-cpu-name="${esc(c.rawName || "")}" data-cpu-label="${esc(c.name)}">取消任务</button></div>` : ""}
    </div>`).join("") : `<div class="empty">没有合成 CPU</div>`;
  document.querySelectorAll("#cpus details").forEach((d, i) => {
    d.dataset.key = i; if (open.has(String(i))) d.open = true;
  });
}

async function refreshState() {
  let s;
  try { s = await api("api/state"); }
  catch (e) { if (e.message !== "login") pill($("statusPill"), "后端无响应", "err"); return; }
  lastState = s;
  renderOrders(s.orders, s.now);
  if (s.status) {
    const age = s.now - s.status.received;
    pill($("statusPill"), `状态 ${ago(age)}`, age < 30 ? "ok" : age < 120 ? "warn" : "err");
    renderPower(s.status.power);
    renderCpus(s.status.cpus);
  }
  const t = s.i18n || {};
  const i18nText = t.error ? `汉化文件读取失败：${t.error}`
    : t.zh ? `汉化 ${full.format(t.zh)} 条${t.pairs ? `（含中英对照 ${full.format(t.pairs)} 条）` : "（未加载英文导出，流体不会汉化）"}`
    : "未加载汉化";
  const m = s.items_meta;
  if (m) {
    const age = s.now - m.updated;
    pill($("itemsPill"), `库存 ${ago(age)}`, age < 300 ? "ok" : age < 1800 ? "warn" : "err");
    $("itemsMeta").textContent = `物品 ${full.format(m.items)} 种 · 流体 ${full.format(m.fluids)} 种`
      + ` · 扫描耗时 ${m.scan_seconds.toFixed(1)} 秒 · ${i18nText}`;
    const stamp = `${m.updated}/${t.version}`;
    if (stamp !== lastItemsUpdate) { lastItemsUpdate = stamp; loadItems(); }
  }
}

// ------------------------------------------------------------ inventory grid

const VIEW_KEY = "aeweb.view";
let compact = false;
try { compact = localStorage.getItem(VIEW_KEY) === "compact"; } catch {}

function itemTitle(r) {
  return [r.z || r.l, r.z ? r.l : null, `${r.n}${r.k === "i" ? ":" + r.d : ""}`,
    `数量：${exact(r.s)}${r.k === "f" ? " L" : ""}`, r.c && r.k === "i" ? "点击下单合成" : null]
    .filter(Boolean).map(s => esc(s)).join("&#10;");
}

const countText = r => `${num(r.s)}${r.k === "f" ? " L" : ""}`;
const clickable = r => r.c && r.k === "i";

function cardHtml(r, i) {
  const badge = clickable(r) ? '<span class="tag can">可合成</span>' : r.k === "f" ? '<span class="tag">流体</span>' : "";
  return `<div class="card${clickable(r) ? " craftable" : ""}" data-i="${i}" title="${itemTitle(r)}">
    <div class="pic">${icon(r.ic)}</div>
    <div class="body"><div class="nm">${esc(r.z || r.l)}</div>
      <div class="foot"><span class="cnt">${countText(r)}</span>${badge}</div></div>
  </div>`;
}

function slotHtml(r, i) {
  const mark = clickable(r) ? '<span class="mark can"></span>' : r.k === "f" ? '<span class="mark fluid"></span>' : "";
  return `<div class="slot${clickable(r) ? " craftable" : ""}" data-i="${i}" title="${itemTitle(r)}">
    ${mark}${icon(r.ic)}<span class="cnt">${num(r.s)}</span></div>`;
}

function applyView() {
  $("rows").className = compact ? "grid compact" : "grid";
  $("viewToggle").textContent = compact ? "卡片视图" : "紧凑视图";
}

function gridColumns() {
  return Math.max(1, getComputedStyle($("rows")).gridTemplateColumns.split(" ").filter(Boolean).length);
}

function computePageSize() {
  const cols = gridColumns();
  const target = compact ? PAGE_TARGET.compact : PAGE_TARGET.cards;
  const rows = Math.max(1, Math.min(Math.round(target / cols), Math.floor(PAGE_MAX / cols)));
  return cols * rows;
}

$("viewToggle").addEventListener("click", () => {
  compact = !compact;
  try { localStorage.setItem(VIEW_KEY, compact ? "compact" : "cards"); } catch {}
  applyView();
  loadItems();
});
applyView();

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (computePageSize() !== pageSize) loadItems(); }, 200);
});

async function loadItems() {
  const [sort, order] = $("sort").value.split(":");
  pageSize = computePageSize();
  offset = Math.floor(offset / pageSize) * pageSize; // keep the page that held the first item
  const qs = new URLSearchParams({q: $("q").value, kind: $("kind").value, sort, order, offset, limit: pageSize});
  let data;
  try { data = await api("api/items?" + qs); } catch { return; }
  total = data.total;
  currentRows = data.rows;
  $("rows").innerHTML = data.rows.map(compact ? slotHtml : cardHtml).join("");
  $("itemsEmpty").hidden = data.rows.length > 0;
  const pages = Math.max(1, Math.ceil(total / pageSize));
  $("pageInfo").textContent = `第 ${Math.floor(offset / pageSize) + 1} / ${pages} 页 · 每页 ${pageSize} 个 · 共 ${full.format(total)} 条`;
  $("prev").disabled = offset === 0;
  $("next").disabled = offset + pageSize >= total;
}

// ------------------------------------------------------------ orders

const ORDER_STATES = {
  queued: ["排队中", ""], sent: ["已发送", ""], computing: ["计算中", "warn"], crafting: ["合成中", "ok"],
  done: ["完成", "ok"], failed: ["失败", "err"], canceled: ["已取消", ""], expired: ["已过期", "err"],
  lost: ["状态未知", "warn"], error: ["错误", "err"],
};
const REASONS = [
  [/missing resources/i, "材料不足"],
  [/no pattern/i, "找不到这个物品的样板"],
  [/cpu changed/i, "CPU 状态已变化"],
  [/no link|no controller|Error submitting/i, "AE 网络无法提交任务"],
  [/withdrawn/i, "已撤回"],
  [/stopped tracking/i, "OC 已不再跟踪这个任务（可能重启过），请在游戏里确认"],
  [/already handled/i, "这条指令已经执行过"],
];
const reasonText = (o) => {
  if (o.state === "expired") return "超过 5 分钟没被 OC 领取，已作废";
  const hit = REASONS.find(([re]) => re.test(o.msg || ""));
  return hit ? hit[1] : (o.msg || "");
};

function renderOrders(orders, now) {
  if (!orders || !orders.length) return;
  $("orders").innerHTML = orders.map(o => {
    const [label, cls] = ORDER_STATES[o.state] || [o.state, ""];
    const what = o.type === "craft"
      ? `<span class="inline">${icon(o.ic, "s")}<span title="${esc(o.l)}">${esc(o.z || o.l)}</span></span> × ${full.format(o.amount)}${o.cpu ? ` <span class="tag">${esc(o.cpu)}</span>` : ""}`
      : `取消 CPU 任务：${esc(o.l)}`;
    const reason = reasonText(o);
    return `<div class="order">
      <div class="what">${what}</div>
      <div class="meta">${ago(now - o.created)}下单${reason ? " · " + esc(reason) : ""}</div>
      <div class="right"><span class="pill ${cls}">${label}</span>
        ${o.state === "queued" ? `<button class="small" data-withdraw="${esc(o.id)}">撤回</button>` : ""}</div>
    </div>`;
  }).join("");
}

function openOrder(row) {
  orderItem = row;
  $("odIcon").innerHTML = icon(row.ic);
  $("odName").textContent = (row.z || row.l).replace(/§./g, "");
  $("odReg").textContent = `${row.z ? row.l.replace(/§./g, "") + " · " : ""}${row.n}:${row.d}`;
  $("odStock").textContent = full.format(row.s);
  $("odAmount").value = 1;
  $("odAmount").max = lastState?.max_order || 1000000;
  $("odError").hidden = true;
  $("odSubmit").disabled = false;
  // OC picks the CPU by name, so unnamed CPUs are listed but cannot be chosen.
  const cpus = [...(lastState?.status?.cpus || [])]
    .sort((a, b) => (!a.rawName - !b.rawName) || (a.busy - b.busy) || (a.index - b.index));
  $("odCpu").innerHTML = `<option value="">自动选择</option>` + cpus.map(c => c.rawName
    ? `<option value="${esc(c.rawName)}">${esc(c.name)}（${bytes(c.storage)}${c.busy ? "，忙碌" : ""}）</option>`
    : `<option disabled>${esc(c.name)}（${bytes(c.storage)}，未命名，不能指定）</option>`).join("");
  $("odCpuHint").hidden = cpus.some(c => c.rawName);
  $("orderDialog").showModal();
  $("odAmount").select();
}

document.querySelectorAll(".steps button").forEach(b => b.addEventListener("click", () => {
  const v = (parseInt($("odAmount").value, 10) || 0) + parseInt(b.dataset.step, 10);
  $("odAmount").value = Math.max(1, v);
}));
$("odCancel").addEventListener("click", () => $("orderDialog").close());
$("orderForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const amount = parseInt($("odAmount").value, 10);
  const max = lastState?.max_order || 1000000;
  const showError = (msg) => { $("odError").textContent = msg; $("odError").hidden = false; };
  if (!Number.isInteger(amount) || amount < 1) return showError("数量必须是正整数");
  if (amount > max) return showError(`数量不能超过 ${full.format(max)}`);
  const name = $("odName").textContent;
  if (amount >= 10000 && !confirm(`确定要合成 ${full.format(amount)} 个「${name}」吗？`)) return;
  $("odSubmit").disabled = true;
  try {
    await postJson("api/orders", {n: orderItem.n, d: orderItem.d, l: orderItem.l, amount, cpu: $("odCpu").value});
    $("orderDialog").close();
    refreshState();
  } catch (e) {
    showError(e.message);
    $("odSubmit").disabled = false;
  }
});

$("rows").addEventListener("click", (ev) => {
  const el = ev.target.closest(".craftable");
  if (el) openOrder(currentRows[Number(el.dataset.i)]);
});
$("cpus").addEventListener("click", async (ev) => {
  const b = ev.target.closest("[data-cancel-cpu]");
  if (!b || !confirm(`确定要取消「${b.dataset.cpuLabel}」上正在进行的合成任务吗？`)) return;
  b.disabled = true;
  try { await postJson("api/cpus/cancel", {index: Number(b.dataset.cancelCpu), name: b.dataset.cpuName}); refreshState(); }
  catch (e) { alert(e.message); b.disabled = false; }
});
$("orders").addEventListener("click", async (ev) => {
  const b = ev.target.closest("[data-withdraw]");
  if (!b) return;
  b.disabled = true;
  try { await postJson(`api/orders/${b.dataset.withdraw}/cancel`, {}); refreshState(); }
  catch (e) { alert(e.message); b.disabled = false; }
});

function requery() { offset = 0; clearTimeout(itemsTimer); itemsTimer = setTimeout(loadItems, 250); }
$("q").addEventListener("input", requery);
$("kind").addEventListener("change", requery);
$("sort").addEventListener("change", requery);
$("prev").addEventListener("click", () => { offset = Math.max(0, offset - pageSize); loadItems(); });
$("next").addEventListener("click", () => { offset += pageSize; loadItems(); });

refreshState();
loadItems();
setInterval(refreshState, 5000);
</script>
</body>
</html>
