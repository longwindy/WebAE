<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AE 网络</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--fg:#1d2330;--muted:#6b7280;--line:#e1e4ea;--soft:#f0f2f5;
  --accent:#2f6fde;--ok:#1f8a5b;--warn:#b7791f;--err:#c2412d;--bar:#2f6fde;
  --act-bg:#e2f1e4;--pend-bg:#f6f0d6;
  /* tallest a scrolling panel (CPU list/detail, inventory) gets: about one screen */
  --pane-h:max(320px, calc(100vh - 200px));
}
@supports (height:100dvh){:root{--pane-h:max(320px, calc(100dvh - 200px))}}
@media (prefers-color-scheme:dark){:root{
  --bg:#14171c;--card:#1d2128;--fg:#e6e8eb;--muted:#9aa1ad;--line:#30353f;--soft:#252a33;
  --accent:#6b9cf0;--ok:#4cc38a;--warn:#e0a84a;--err:#ef7d68;--bar:#6b9cf0;
  --act-bg:#1f3a2b;--pend-bg:#3a3420;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:1480px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:17px;margin:0;margin-right:auto}
#netSel{padding:4px 8px;border:1px solid var(--line);border-radius:7px;background:var(--card);max-width:200px}
.who{color:var(--muted);font-size:13px;white-space:nowrap}
.nonet{max-width:520px;margin:48px auto;padding:20px;text-align:center;color:var(--muted);
  background:var(--card);border:1px solid var(--line);border-radius:10px}
h2{font-size:15px;margin:0 0 12px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
h2 small{font-weight:400;color:var(--muted);font-size:13px}
main{max-width:1480px;margin:0 auto;padding:16px;display:grid;gap:16px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.err{color:var(--err)}
button,select,input{font:inherit;color:inherit}
button{background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:5px 12px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--soft);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px}
.meter{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:4px 0 14px}
.meter i{display:block;height:100%;background:var(--bar)}
.cpuwrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px;align-items:start}
.cpulist{display:flex;flex-direction:column;gap:6px;max-height:var(--pane-h);overflow:auto}
.cpuitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;text-align:left;
  width:100%;padding:7px 9px;border:1px solid var(--line);border-left-width:3px;border-radius:8px;background:var(--card)}
.cpuitem.busy{border-left-color:var(--ok)}
.cpuitem.sel{border-color:var(--accent);background:var(--soft)}
.cpuitem .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpuitem .tgt{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.cpuitem .meta{grid-column:1 / -1;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
/* at most one screen tall: the header stays put and the cells scroll below it */
.cpudetail{min-width:0;border:1px solid var(--line);border-radius:8px;padding:10px;
  display:flex;flex-direction:column;max-height:var(--pane-h)}
.cdscroll{flex:0 1 auto;min-height:0;overflow-y:auto;scrollbar-gutter:stable;padding-right:4px}
.cdhead{flex:none;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px}
.cdhead .target{display:flex;gap:8px;align-items:center;font-weight:600;min-width:0;overflow-wrap:anywhere}
.cdhead .time{font-variant-numeric:tabular-nums}
.cdhead .meta{color:var(--muted);font-size:12px}
.cdhead .spacer{flex:1}
.cdhead input{flex:0 1 240px;min-width:0;padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:transparent}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));grid-auto-rows:1fr;gap:6px}
.ccell{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 8px;
  border:1px solid var(--line);border-radius:6px;min-width:0}
/* room for the name plus two count lines, so every cell matches an active/pending one */
.ccell .txt{min-width:0;font-size:12px;line-height:1.45;min-height:calc(13px * 1.45 + 2 * 12px * 1.45)}
.ccell .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccell .ln{color:var(--muted);font-variant-numeric:tabular-nums}
.ccell .ln.act{color:var(--ok);font-weight:600}
.ccell.active{background:var(--act-bg)}
.ccell.pending{background:var(--pend-bg)}
@media (max-width:760px){.cpuwrap{grid-template-columns:1fr}.cpulist{max-height:300px}}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tools input{flex:1 1 220px;min-width:0;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:transparent}
.tools select{padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:6px}
.card{display:flex;gap:8px;padding:6px;border:1px solid var(--line);border-radius:8px;min-width:0;background:var(--card)}
.card .pic{flex:0 0 34%;max-width:80px;aspect-ratio:1;display:grid;place-items:center;
  background:var(--soft);border-radius:6px;align-self:center}
.card .pic .ic{width:80%;height:80%}
.card .body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.card .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:13px;line-height:1.35;overflow-wrap:anywhere}
.card .cnt{font-size:13px}
.card .foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 4px}
.card .foot .tag{white-space:nowrap;font-size:10px;padding:0 4px}
.card .cnt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.card .tag{margin-left:0}
.grid.compact{grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:4px}
.slot{position:relative;aspect-ratio:1;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:4px;background:var(--soft);min-width:0}
.slot .ic{width:68%;height:68%}
.slot .cnt{position:absolute;right:3px;bottom:1px;font-size:11px;font-weight:700;line-height:1.2;
  font-variant-numeric:tabular-nums;text-shadow:0 0 2px var(--card),0 0 2px var(--card)}
.slot .mark{position:absolute;left:3px;top:3px;width:7px;height:7px;border-radius:50%}
.slot .mark.can{background:var(--accent)}
.slot .mark.fluid{background:var(--muted)}
.craftable{cursor:pointer}
.card.craftable:hover,.slot.craftable:hover{border-color:var(--accent)}
@media (max-width:480px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
  .card{gap:8px;padding:6px}
  .card .nm{font-size:13px}
}
.label{overflow-wrap:anywhere}
.reg{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.tag{font-size:11px;padding:0 6px;border-radius:4px;background:var(--soft);color:var(--muted);margin-left:6px}
/* Fixed-height results box: searching never changes the page height, so the
   inventory does not jump down the page when the result list gets shorter. */
.invbox{height:var(--pane-h);overflow-y:auto;scrollbar-gutter:stable;padding-right:4px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--muted)}
.empty{color:var(--muted);padding:12px 0}
.ic{width:32px;height:32px;flex:none;image-rendering:pixelated;vertical-align:middle}
.ic.s{width:20px;height:20px}
.ic.none{display:inline-block;border-radius:4px;background:var(--soft)}
.inline{display:inline-flex;gap:6px;align-items:center;vertical-align:middle;max-width:100%}
dialog .head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
dialog .head .reg{margin:0}
.tag.can{color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--err)}
button.small{padding:1px 8px;font-size:12px}
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.orders .empty{grid-column:1 / -1}
.ocard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;min-width:0;
  padding:8px 10px;border:1px solid var(--line);border-left-width:3px;border-radius:8px;background:var(--card)}
.ocard.ok{border-left-color:var(--ok)}.ocard.warn{border-left-color:var(--warn)}.ocard.err{border-left-color:var(--err)}
.ocard .ic{grid-row:1 / span 2}
.ocard .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocard .amt{font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocard .meta{grid-column:1 / -1;color:var(--muted);font-size:12px;overflow-wrap:anywhere;margin-top:2px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);
  padding:20px;width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 4px;font-size:16px}
dialog .reg{margin-bottom:12px}
dialog label{display:block;margin:12px 0 4px;color:var(--muted);font-size:13px}
dialog input,dialog select{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card)}
dialog label .preview{float:right;color:var(--fg);font-variant-numeric:tabular-nums}
.steps{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.steps button{flex:1;padding:4px 0;font-size:13px}
.note{color:var(--muted);font-size:12px;margin:12px 0 0}
.err-text{color:var(--err);font-size:13px;margin:10px 0 0}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
</style>
</head>
<body>
<header><div class="bar">
  <h1>AE 网络</h1>
  <span id="statusPill" class="pill">等待数据</span>
  <span id="itemsPill" class="pill">库存：无</span>
  <select id="netSel" title="切换 AE 网络" hidden></select>
  <span id="whoami" class="who"></span>
  <form method="post" action="logout"><button>退出</button></form>
</div></header>
<div id="noNet" class="nonet" hidden>你的账号还没有加入任何 AE 网络，请联系管理员授权。</div>
<main id="main">
  <section>
    <h2>能量</h2>
    <div id="power" class="empty">还没有收到 OC 的上报</div>
  </section>
  <section>
    <h2>合成 CPU <small id="cpuSummary"></small></h2>
    <div class="cpuwrap">
      <div id="cpuList" class="cpulist"><div class="empty">没有合成 CPU</div></div>
      <div class="cpudetail">
        <div class="cdhead">
          <div class="target" id="cdTarget"></div>
          <span class="time" id="cdTime"></span>
          <span class="meta" id="cdAge"></span>
          <span class="spacer"></span>
          <input id="cdQ" type="search" placeholder="">
          <button type="button" class="small danger" id="cdCancel" hidden>取消任务</button>
        </div>
        <div id="cdScroll" class="cdscroll">
          <div id="cdGrid" class="cgrid"></div>
          <div id="cdEmpty" class="empty">选择左侧的 CPU 查看详情</div>
        </div>
      </div>
    </div>
  </section>
  <section>
    <h2>历史订单</h2>
    <div id="orders" class="orders"><div class="empty">还没有订单</div></div>
  </section>
  <section>
    <h2>库存 <small id="itemsMeta"></small></h2>
    <div class="tools">
      <input id="q" type="search" placeholder="搜索库存...">
      <select id="kind">
        <option value="all">全部</option><option value="i">物品</option>
        <option value="f">流体</option><option value="c">可合成</option>
      </select>
      <select id="sort">
        <option value="size:desc">数量 多→少</option><option value="size:asc">数量 少→多</option>
        <option value="name:asc">名称 A→Z</option>
      </select>
      <button id="viewToggle" type="button"></button>
    </div>
    <div id="invBox" class="invbox">
      <div id="rows" class="grid"></div>
      <div id="itemsEmpty" class="empty" hidden>没有匹配的条目</div>
    </div>
    <div class="pager">
      <span id="pageInfo"></span>
      <button id="prev">上一页</button><button id="next">下一页</button>
    </div>
  </section>
</main>
<dialog id="orderDialog">
  <form id="orderForm" method="dialog">
    <div class="head">
      <span id="odIcon"></span>
      <div><h3 id="odName"></h3><span class="reg" id="odReg"></span></div>
    </div>
    <div class="meta">当前库存：<span id="odStock"></span></div>
    <label for="odAmount"><span id="odAmountLabel">数量</span> <span class="preview" id="odPreview"></span></label>
    <input id="odAmount" type="text" value="1" required autocomplete="off" spellcheck="false"
      title="支持 k/m/g 单位（2k = 2000）、s = 64 个、i = 144 L，以及 + - * / ^ ( ) 算式">
    <div class="steps">
      <button type="button" data-step="-1000">-1000</button><button type="button" data-step="-100">-100</button>
      <button type="button" data-step="-10">-10</button><button type="button" data-step="-1">-1</button>
      <button type="button" data-step="1">+1</button><button type="button" data-step="10">+10</button>
      <button type="button" data-step="100">+100</button><button type="button" data-step="1000">+1000</button>
    </div>
    <label for="odCpu">合成 CPU</label>
    <select id="odCpu"></select>
    <p class="note" id="odCpuHint" hidden>只能指定有名字的 CPU：在铁砧里给一个合成存储器或合成单元改名，再放进 CPU 结构里。</p>
    <p class="err-text" id="odError" hidden></p>
    <div class="dialog-actions">
      <button type="button" id="odCancel">取消</button>
      <button type="submit" class="primary" id="odSubmit">开始合成</button>
    </div>
  </form>
</dialog>
<script>
// Page size is a whole number of grid rows (about the view's target count), so
// every page but the last ends on a full row; it follows the column count.
const PAGE_TARGET = {cards: 240, compact: 480};
const PAGE_MAX = 500; // backend limit
let pageSize = PAGE_TARGET.cards;
const $ = id => document.getElementById(id);
const full = new Intl.NumberFormat("en-US");

// Port of AE2's ReadableNumberConverter (toWideReadableForm, the terminal's
// small-font width of 4): base 1000, suffixes kMGTPE, one truncated decimal
// (kept even when it is 0, e.g. "1.0M"), dropped when it does not fit.
function aeNum(n, width = 4) {
  n = Math.max(0, Math.floor(Number(n) || 0));
  const s = String(n);
  if (s.length <= width) return s;
  let base = n, last = n, exp = -1, len = s.length, post = "";
  while (len > width) {
    last = base;
    base = Math.floor(base / 1000);
    exp++;
    len = String(base).length + 1;
    post = "kMGTPE"[exp];
  }
  const tenths = Math.floor(last / 100);
  const withDecimal = `${Math.floor(tenths / 10)}.${tenths % 10}${post}`;
  return withDecimal.length <= width ? withDecimal : base + post;
}
let offset = 0, total = 0, lastItemsUpdate = null, itemsTimer = null;
let lastState = null, currentRows = [], orderItem = null;

const esc = s => String(s ?? "").replace(/§./g, "").replace(/[&<>"]/g,
  c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const num = n => aeNum(n);
const exact = n => full.format(Math.floor(Number(n) || 0));
const bytes = n => {
  const units = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return `${Math.round(n * 10) / 10} ${units[i]}`;
};
const dur = s => {
  s = Math.max(0, Math.round(s));
  if (s < 60) return `${s} 秒`;
  if (s < 3600) return `${Math.floor(s / 60)} 分 ${s % 60} 秒`;
  return `${Math.floor(s / 3600)} 小时 ${Math.floor(s % 3600 / 60)} 分`;
};
const ago = s => s < 60 ? `${Math.round(s)} 秒前` : s < 3600 ? `${Math.round(s / 60)} 分钟前`
  : `${Math.round(s / 3600)} 小时前`;

// ------------------------------------------------------------ user and network
// Every api/ call (except api/me) is about one AE network, passed as ?net=.
const NET_KEY = "aeweb.net";
let me = null, currentNet = null;
const role = () => lastState?.role || me?.networks.find(n => n.name === currentNet)?.role || "viewer";
const canOrder = () => role() !== "viewer";
const isOwner = () => role() === "owner";
const withNet = path => path + (path.includes("?") ? "&" : "?") + "net=" + encodeURIComponent(currentNet);

async function api(path) {
  const res = await fetch(withNet(path), {cache: "no-store"});
  if (res.status === 401) { location.href = "login"; throw new Error("login"); }
  if (res.status === 403) { loadMe(); throw new Error("forbidden"); } // access changed: re-read networks
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

async function postJson(path, body) {
  const res = await fetch(withNet(path), {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)});
  if (res.status === 401) { location.href = "login"; throw new Error("请重新登录"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = data.detail;
    throw new Error(typeof d === "string" ? d : Array.isArray(d) ? d.map(x => x.msg).join("；") : `HTTP ${res.status}`);
  }
  return data;
}

function pill(el, text, cls) { el.textContent = text; el.className = "pill " + cls; }

function renderPower(p) {
  if (!p) return;
  const pct = p.max > 0 ? Math.min(100, p.stored / p.max * 100) : 0;
  $("power").className = "";
  $("power").innerHTML = `
    <div class="meta" title="${exact(p.stored)} / ${exact(p.max)} AE">储能 ${num(p.stored)} / ${num(p.max)} AE（${pct.toFixed(1)}%）</div>
    <div class="meter"><i style="width:${pct}%"></i></div>
    <div class="stats">
      <div class="stat"><b title="${exact(p.avgUse)}">${num(p.avgUse)}</b><span>平均消耗 AE/t</span></div>
      <div class="stat"><b title="${exact(p.avgInject)}">${num(p.avgInject)}</b><span>平均输入 AE/t</span></div>
      <div class="stat"><b title="${exact(p.idle)}">${num(p.idle)}</b><span>待机消耗 AE/t</span></div>
    </div>`;
}

const icon = (ic, cls = "") => ic
  ? `<img class="ic ${cls}" src="icons/${ic}.png" loading="lazy" alt="">`
  : `<span class="ic ${cls} none"></span>`;
// ------------------------------------------------------------ crafting CPUs
// Left: every CPU. Right: the selected one like the in-game crafting monitor,
// one cell per item with its stored / crafting / scheduled amounts.

const cpuKey = () => "aeweb.cpu." + currentNet; // remembered per network
let selectedCpu = null, cpuDetailTimer = null, clockOffset = 0;

const hms = s => {
  s = Math.max(0, Math.floor(s));
  return [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60].map(v => String(v).padStart(2, "0")).join(":");
};
// Elapsed time is counted from when the backend first saw the CPU busy; "≥" when
// the start was not observed (backend restarted or reports paused meanwhile).
const sinceSpan = c => `<span data-since="${c.since}" data-exact="${c.exact ? 1 : 0}" title="${c.exact
  ? "从网页首次检测到开始合成时计时，误差约一个上报间隔" : "开始时间未观察到，实际时间更长"}"></span>`;

function tickClocks() {
  const now = Date.now() / 1000 + clockOffset;
  document.querySelectorAll("[data-run]").forEach(el => { el.textContent = dur(now - Number(el.dataset.run)); });
  document.querySelectorAll("[data-since]").forEach(el => {
    el.textContent = (el.dataset.exact === "1" ? "" : "≥ ") + hms(now - Number(el.dataset.since));
  });
}
setInterval(tickClocks, 1000);

function targetHtml(c) {
  if (!c.busy) return "空闲";
  if (c.final) return `${icon(c.final.ic)}<span title="${esc(c.final.l)}">${esc(c.final.z || c.final.l)}</span>`
    + `<span title="${exact(c.final.s)}">× ${num(c.final.s)}</span>`;
  return /No crafting monitor/.test(c.finalError || "")
    ? '<span class="meta">目标未知（CPU 里没有合成监控器）</span>' : '<span class="meta">目标未知</span>';
}

function renderCpuList(cpus) {
  cpus = cpus || [];
  const busy = cpus.filter(c => c.busy).length;
  $("cpuSummary").textContent = cpus.length ? `忙碌 ${busy} / 共 ${cpus.length}` : "";
  if (!cpus.some(c => c.index === selectedCpu)) selectedCpu = (cpus.find(c => c.busy) || cpus[0] || {}).index ?? null;
  const sorted = [...cpus].sort((a, b) => (b.busy - a.busy) || (a.index - b.index));
  $("cpuList").innerHTML = sorted.length ? sorted.map(c => `
    <button type="button" class="cpuitem${c.busy ? " busy" : ""}${c.index === selectedCpu ? " sel" : ""}" data-cpu="${c.index}">
      <span class="nm" title="${esc(c.name)}">${esc(c.name)}</span>

      <span class="meta">${bytes(c.storage)} · 并行处理单元 ${c.coprocessors} · ${c.busy ? sinceSpan(c) : "空闲"}</span>
    </button>`).join("") : `<div class="empty">没有合成 CPU</div>`;
  tickClocks();
}

function cellHtml(r) {
  const tip = [r.z || r.l, r.z ? r.l : null, `${r.n}:${r.d}`,
    r.s ? `现存：${exact(r.s)}` : null, r.a ? `正在合成：${exact(r.a)}` : null, r.p ? `计划合成：${exact(r.p)}` : null]
    .filter(Boolean).map(s => esc(s)).join("&#10;");
  return `<div class="ccell${r.a > 0 ? " active" : r.p > 0 ? " pending" : ""}" title="${tip}">
    <div class="txt"><div class="nm">${esc(r.z || r.l)}</div>
      ${r.s ? `<div class="ln">现存 ${num(r.s)}</div>` : ""}${r.a ? `<div class="ln act">正在合成 ${num(r.a)}</div>` : ""}
      ${r.p ? `<div class="ln">计划合成 ${num(r.p)}</div>` : ""}</div>${icon(r.ic)}</div>`;

async function loadCpuDetail() {
  if (selectedCpu == null || !currentNet) return;
  const index = selectedCpu, net = currentNet;
  let d;
  try { d = await api(`api/cpus/${index}?` + new URLSearchParams({q: $("cdQ").value})); } catch { return; }
  if (index !== selectedCpu || net !== currentNet) return; // selection changed while loading
  const c = d.cpu;
  $("cdTarget").innerHTML = `<span>${esc(c.name)}</span> · ${targetHtml(c)}`;
  $("cdTime").innerHTML = c.busy ? `已合成 ${sinceSpan(c)}` : "";
  $("cdAge").textContent = !c.busy ? "" : c.detailAt
    ? `详情 ${ago(d.now - c.detailAt)}更新${d.truncated ? " · 列表过长，只展示部分内容" : ""}` : "";
  const cancel = $("cdCancel");
  cancel.hidden = !c.busy || !isOwner(); // only owners may stop a CPU job

  $("cdGrid").innerHTML = d.rows.map(cellHtml).join("");

$("cdCancel").addEventListener("click", async () => {

async function refreshState() {
  if (!currentNet) return;
  const net = currentNet;
  let s;
  try { s = await api("api/state"); }
  catch (e) { if (!["login", "forbidden"].includes(e.message)) pill($("statusPill"), "后端无响应", "err"); return; }
  if (net !== currentNet) return; // switched network while loading
  lastState = s;
  clockOffset = s.now - Date.now() / 1000;
  renderOrders(s.orders, s.now);
  if (s.status) {
    const age = s.now - s.status.received;
    pill($("statusPill"), `状态 ${ago(age)}`, age < 30 ? "ok" : age < 120 ? "warn" : "err");
    renderPower(s.status.power);
    renderCpuList(s.status.cpus);
    loadCpuDetail();
  }
  const t = s.i18n || {};
  const i18nText = t.error ? `汉化文件读取失败：${t.error}`
    : t.zh ? `汉化 ${full.format(t.zh)} 条${t.pairs ? `（含中英对照 ${full.format(t.pairs)} 条）` : "（未加载英文导出，流体不会汉化）"}`
    : "未加载汉化";
  const m = s.items_meta;
  if (m) {
    const age = s.now - m.updated;
    pill($("itemsPill"), `库存 ${ago(age)}`, age < 300 ? "ok" : age < 1800 ? "warn" : "err");
    $("itemsMeta").textContent = `物品 ${full.format(m.items)} 种 · 流体 ${full.format(m.fluids)} 种`
      + ` · 扫描耗时 ${m.scan_seconds.toFixed(1)} 秒 · ${i18nText}`;
    const stamp = `${m.updated}/${t.version}`;
    if (stamp !== lastItemsUpdate) { lastItemsUpdate = stamp; loadItems(); }
  }
}

function computePageSize() {
  const cols = gridColumns();
  const target = compact ? PAGE_TARGET.compact : PAGE_TARGET.cards;
  const rows = Math.max(1, Math.min(Math.round(target / cols), Math.floor(PAGE_MAX / cols)));
  return cols * rows;
}

  const [sort, order] = $("sort").value.split(":");

// Port of GTNHLib MathExpressionParser, which AE2's amount box uses: + - * / ^, brackets,
// "e" (2e3), and suffixes k m g/b t (powers of 1000), s (×64), i (×144), % (×0.01×100 in AE = ×1).
// Spaces, "_" and "," separators are ignored. Returns NaN on a syntax error.
const EXPR_OPS = {"+": [10, (a, b) => a + b], "-": [10, (a, b) => a - b], "*": [20, (a, b) => a * b],
  "/": [20, (a, b) => a / b], "u+": [30, (a, b) => b], "u-": [30, (a, b) => -b],
  "^": [40, (a, b) => a ** b], "e": [50, (a, b) => a * 10 ** b], "(": [-1]};
const EXPR_SUFFIX = {k: 1e3, m: 1e6, g: 1e9, b: 1e9, t: 1e12, s: 64, i: 144, "%": 1,
  "к": 1e3, "м": 1e6, "г": 1e9, "т": 1e12, "с": 64};
function parseExpr(text) {
  const src = String(text).replace(/[\s_]/g, "").toLowerCase().replace(/е/g, "e");
  if (!src) return NaN;
  const st = [];  // values are numbers, operators are strings
  const top = () => st[st.length - 1];
  const isVal = (x) => typeof x === "number";
  const reduce = (prio) => {  // collapse "value op value" while op binds at least this tightly
    while (st.length >= 3 && EXPR_OPS[st[st.length - 2]][0] >= prio) {
      const b = st.pop(), op = st.pop(), a = st.pop();
      st.push(EXPR_OPS[op][1](a, b));
    }
  };
  const binary = (op) => {
    if (!st.length || !isVal(top())) return false;
    reduce(op === "^" ? EXPR_OPS[op][0] + 1 : EXPR_OPS[op][0]);  // ^ is right-associative
    st.push(op);
    return true;
  };
  for (let i = 0; i < src.length; i++) {
    const ch = src[i];
    const num = /^(\d[\d,]*(\.\d*)?|\.\d+)/.exec(src.slice(i));
    let ok = true;
    if (num) {
      if (st.length && isVal(top())) return NaN;  // number right after a number
      st.push(parseFloat(num[0].replace(/,/g, "")));
      i += num[0].length - 1;
    } else if (ch === "+" || ch === "-") {
      if (!st.length || !isVal(top())) st.push(0, "u" + ch);
      else ok = binary(ch);
    } else if ("*/^e".includes(ch)) ok = binary(ch);
    else if (ch in EXPR_SUFFIX) {
      if (!st.length || !isVal(top())) return NaN;
      st.push(st.pop() * EXPR_SUFFIX[ch]);
    } else if (ch === "(") {
      if (st.length && isVal(top())) return NaN;
      st.push("(");
    } else if (ch === ")") {
      if (!st.length || !isVal(top())) return NaN;
      reduce(0);
      if (st.length < 2 || st[st.length - 2] !== "(") return NaN;
      const v = st.pop(); st.pop(); st.push(v);
    } else return NaN;
    if (!ok) return NaN;
  }
  if (!st.length || !isVal(top())) return NaN;
  reduce(0);
  return st.length === 1 && isVal(st[0]) ? st[0] : NaN;
}
// Like AE2 GuiAmount.getAmountLong: not positive or unparsable counts as 0, rounded half up.
const amountOf = (text) => { const v = parseExpr(text); return v > 0 ? Math.round(v) : 0; };

function showAmountPreview() {
  const text = $("odAmount").value.trim();

// The wheel should scroll whatever is under the cursor right now. Browsers latch a wheel
// gesture to the element it started on, so a page scroll kept scrolling the page after a
// scroll box moved under the cursor. Only that latched case is taken over: wheel events
// that already target the box keep the browser's own (smooth) scrolling. When the box is
// at its top/bottom the event is left alone and the page scrolls.
const SCROLL_BOXES = ["invBox", "cpuList", "cdScroll"];
const wheelAnim = new Map(); // box -> { target, frame }
function animateBox(box) {
  const st = wheelAnim.get(box);
  if (!st || st.target === null) { wheelAnim.delete(box); return; } // native scrolling took over
  const diff = st.target - box.scrollTop;
  if (Math.abs(diff) < 1) { box.scrollTop = st.target; wheelAnim.delete(box); return; }
  const before = box.scrollTop;
  box.scrollTop += diff * 0.25; // ease out over a few frames
  if (box.scrollTop === before) { wheelAnim.delete(box); return; } // hit an edge
  st.frame = requestAnimationFrame(() => animateBox(box));
}
window.addEventListener("wheel", (ev) => {
  if (ev.ctrlKey || ev.defaultPrevented || document.querySelector("dialog[open]")) return;
  for (const id of SCROLL_BOXES) {
    const box = $(id);
    if (box.contains(ev.target)) { const st = wheelAnim.get(box); if (st) st.target = null; return; }
    const r = box.getBoundingClientRect();
    if (ev.clientX < r.left || ev.clientX > r.right || ev.clientY < r.top || ev.clientY > r.bottom) continue;
    const dy = ev.deltaY * (ev.deltaMode === 1 ? 16 : ev.deltaMode === 2 ? box.clientHeight : 1);
    const max = box.scrollHeight - box.clientHeight;
    if (!dy || max < 1) return;
    const st = wheelAnim.get(box);
    const from = st?.target ?? box.scrollTop;
    if ((dy > 0 && from >= max - 1) || (dy < 0 && from <= 1)) return;
    ev.preventDefault();
    const target = Math.max(0, Math.min(max, from + dy));
    if (st) st.target = target;
    else { wheelAnim.set(box, {target, frame: 0}); requestAnimationFrame(() => animateBox(box)); }
    return;
  }
}, {passive: false});

// Reads who is logged in and their networks, then opens the remembered (or first) network.
async function loadMe() {
  let res;
  try { res = await fetch("api/me", {cache: "no-store"}); } catch { return; }
  if (res.status === 401) { location.href = "login"; return; }
  if (!res.ok) return;
  me = await res.json();
  $("whoami").textContent = me.user + (me.admin ? "（管理员）" : "");
  const nets = me.networks;
  $("noNet").hidden = nets.length > 0;
  $("main").hidden = !nets.length;
  $("netSel").hidden = nets.length < 2;
  $("netSel").innerHTML = nets.map(n => `<option value="${esc(n.name)}">${esc(n.name)}</option>`).join("");
  let want = currentNet;
  if (want == null) try { want = localStorage.getItem(NET_KEY); } catch {}
  if (!nets.some(n => n.name === want)) want = nets[0]?.name ?? null;
  if (want !== currentNet) switchNet(want);
  else if (want) $("netSel").value = want;
}

function switchNet(id) {
  currentNet = id;
  if (id) { $("netSel").value = id; try { localStorage.setItem(NET_KEY, id); } catch {} }
  // forget everything shown for the previous network
  lastState = null; lastItemsUpdate = null; offset = 0; resetInvScroll = true;
  currentRows = []; selectedCpu = null;
  try { selectedCpu = Number(localStorage.getItem(cpuKey())) || null; } catch {}
  pill($("statusPill"), "等待数据", ""); pill($("itemsPill"), "库存：无", "");
  $("power").className = "empty"; $("power").textContent = "还没有收到 OC 的上报";
  $("cpuSummary").textContent = ""; $("itemsMeta").textContent = "";
  $("cpuList").innerHTML = '<div class="empty">没有合成 CPU</div>';
  $("cdTarget").innerHTML = $("cdTime").innerHTML = $("cdAge").textContent = $("cdGrid").innerHTML = "";
  $("cdCancel").hidden = true; $("cdQ").value = "";
  $("cdEmpty").textContent = "选择左侧的 CPU 查看详情"; $("cdEmpty").hidden = false;
  renderOrders([], 0);
  $("rows").innerHTML = ""; $("pageInfo").textContent = "";
  if (id) { refreshState(); loadItems(); }
}
$("netSel").addEventListener("change", () => switchNet($("netSel").value));

loadMe();
setInterval(refreshState, 5000);
setInterval(loadMe, 60000); // picks up networks granted or removed meanwhile
</script>
</body>
</html>
