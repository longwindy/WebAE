# Copy this file to config.toml and change every value.

# Address the backend listens on. Keep 127.0.0.1 when a tunnel
# (cloudflared / frp) runs on the same machine; use 0.0.0.0 only when
# the port is exposed directly.
host = "127.0.0.1"
port = 8765

# AE networks (each with its own OC token) and users (each with a login key)
# are not set here: manage them with  uv run python manage.py --help
# They are stored in <data_dir>/accounts.json.
#
# Upgrading from the single-password version: keep your old oc_token line. On the
# first start it becomes network "main" so that OC keeps working; after that it
# is no longer read and can be deleted. web_password is no longer used.

# Where users, networks and the last received data are kept.
data_dir = "data"

# Largest amount one web order may request: items, and fluids in L (mB).
max_order_amount = 2147483647
max_order_fluid_amount = 2147483647
